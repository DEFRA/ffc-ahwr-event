version: '3.9'

services:
  ffc-ahwr-event-azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose"
    volumes:
      - azurite_data:/data
    ports:
      - "10020:10000"
      - "10021:10001"
      - "10022:10002"

  ffc-ahwr-event-sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    platform: linux/amd64
    restart: on-failure:5
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "L0cal-Dev-P@ssw0rd"
    networks:
      - servicebus-emulator

  ffc-ahwr-event-servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    restart: on-failure:5
    volumes:
      - "./servicebus-emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: ffc-ahwr-event-sqledge
      MSSQL_SA_PASSWORD: "L0cal-Dev-P@ssw0rd"
      ACCEPT_EULA: "Y"
    depends_on:
      - ffc-ahwr-event-sqledge
    networks:
      - servicebus-emulator

networks:
  servicebus-emulator:

volumes:
  azurite_data: